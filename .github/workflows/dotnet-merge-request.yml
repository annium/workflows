name: .NET Merge Request

# Reusable merge-request pipeline for Annium .NET sub-projects.
#
# The workflow knows only how to set up the toolchain and invoke `just`; every
# repo-specific step (format, lint, build, test) lives in the caller's justfile
# under the `ci-merge-request-short` / `ci-merge-request-full` recipes.

on:
  workflow_call:
    inputs:
      dotnet-version:
        description: .NET SDK version handed to actions/setup-dotnet.
        type: string
        default: '10.0.x'
      runs-on:
        description: Runner label the jobs execute on.
        type: string
        default: ubuntu-latest
      short-pipeline-marker:
        description: >-
          Substring in the pull-request title that switches the run from
          `ci-merge-request-full` to `ci-merge-request-short`.
        type: string
        default: 'skip ci'
      test-results-retention-days:
        description: How long the TRX artifact is kept.
        type: number
        default: 30

jobs:
  init:
    runs-on: ${{ inputs.runs-on }}
    outputs:
      run_full: ${{ steps.check.outputs.run_full }}
    steps:
      - name: Check whether the full pipeline should run
        id: check
        run: echo "run_full=${{ !contains(github.event.pull_request.title, inputs.short-pipeline-marker) }}" >> $GITHUB_OUTPUT

  run-short:
    runs-on: ${{ inputs.runs-on }}
    needs: init
    if: ${{ needs.init.outputs.run_full != 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Setup just
        uses: extractions/setup-just@v4

      - name: Run
        run: just ci-merge-request-short

  run-full:
    runs-on: ${{ inputs.runs-on }}
    needs: init
    if: ${{ needs.init.outputs.run_full == 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Setup just
        uses: extractions/setup-just@v4

      - name: Run
        run: just ci-merge-request-full

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: '**/*.trx'
          if-no-files-found: warn
          retention-days: ${{ inputs.test-results-retention-days }}

  report:
    runs-on: ${{ inputs.runs-on }}
    needs: [ init, run-full ]
    if: ${{ always() && needs.init.outputs.run_full == 'true' }}
    steps:
      - name: Download test results artifact
        id: download
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: test-results
          path: test-results

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2.24.0
        if: steps.download.outcome == 'success'
        with:
          files: "test-results/**/*.trx"
