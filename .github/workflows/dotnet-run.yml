name: .NET Run

# One job: bring up the toolchain and invoke one `just` recipe.
#
# It knows nothing about pipelines. What the recipe does lives in the calling repository's justfile;
# what shape the pipeline has - which recipes run, in what order, with what matrix - lives in the
# caller's workflow. This file only removes the eight lines of setup each of those jobs would repeat.
#
# Use dotnet-test.yml instead when the recipe produces test results worth collecting.

on:
  workflow_call:
    inputs:
      recipe:
        description: The `just` recipe to run.
        type: string
        required: true
      dotnet-version:
        description: .NET SDK version handed to actions/setup-dotnet.
        type: string
        default: '10.0.x'
      runs-on:
        description: Runner label the job executes on.
        type: string
        default: ubuntu-latest
      timeout-minutes:
        description: >-
          Job timeout. GitHub's default is 360 minutes, which is not a limit so much as an absence of
          one: a test that hangs on a network call burns six hours of runner time before anyone hears
          about it. Set this to a little above the honest duration of the recipe.
        type: number
        default: 20

jobs:
  run:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Setup just
        uses: extractions/setup-just@v4

      - name: Run
        run: just ${{ inputs.recipe }}
