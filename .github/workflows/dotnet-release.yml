name: .NET Release

# The one job that publishes. It sets up the toolchain and hands the whole release sequence -
# version bump, build, pack, push, tag - to the caller's `ci-release` recipe.
#
# Tests are not part of it. In the v2 shape they run as their own jobs, which the caller places
# before this one, so that a release is gated by the same recipes a merge request runs rather than
# by a second copy of them buried in a release-only pipeline.

on:
  workflow_call:
    inputs:
      dotnet-version:
        description: .NET SDK version handed to actions/setup-dotnet.
        type: string
        default: '10.0.x'
      runs-on:
        description: Runner label the job executes on.
        type: string
        default: ubuntu-latest
      test-results-retention-days:
        description: How long the TRX artifact is kept, if the release recipe produces one.
        type: number
        default: 30
    secrets:
      NUGET_API_KEY:
        description: API key the `publish` recipe pushes packages with.
        required: true

jobs:
  release:
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Setup just
        uses: extractions/setup-just@v4

      - name: Run
        run: just ci-release "${{ secrets.NUGET_API_KEY }}" "${{ github.repository }}" "${{ secrets.GITHUB_TOKEN }}"

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-release
          path: '**/*.trx'
          if-no-files-found: ignore
          retention-days: ${{ inputs.test-results-retention-days }}
